<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf6ec" />
    <script>
      try {
        var m = localStorage.getItem('theme-mode');
        var h = Number(new Intl.DateTimeFormat('en-GB', { hour: 'numeric', hourCycle: 'h23', timeZone: 'Asia/Kolkata' }).format(new Date())) % 24;
        var d = m === 'dark' || (m !== 'light' && (h < 6 || h >= 18));
        if (d) { document.documentElement.classList.add('dark'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#171a26'); }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <title>Sagnik Dey — AI-Augmented Full-Stack Engineer</title>
    <meta
      name="description"
      content="Sagnik Dey — AI-Augmented Full-Stack Engineer building intelligent web apps with React, TypeScript, Python, LLMs and Computer Vision. Based in Kolkata, India."
    />
    <meta name="author" content="Sagnik Dey" />
    <meta
      name="keywords"
      content="Sagnik Dey, Full-Stack Engineer, AI Engineer, React, TypeScript, Python, LLM, Computer Vision, SDET, Kolkata, Portfolio"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sagnik Dey — AI-Augmented Full-Stack Engineer" />
    <meta
      property="og:description"
      content="Building intelligent, production-grade web apps with React, TypeScript, Python, LLMs, and Computer Vision."
    />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sagnik Dey — AI-Augmented Full-Stack Engineer" />
    <meta
      name="twitter:description"
      content="Building intelligent, production-grade web apps with React, TypeScript, Python, LLMs, and Computer Vision."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
